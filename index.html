<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Previsão de Abate Bovino</title>

<style>
/* Layout: fixed left rail with the model's modules, a wide working canvas; charts drawn in SVG from theme tokens. */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:18px;letter-spacing:-.01em}
h2{font-size:20px;letter-spacing:-.015em}
h3{font-size:13.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);font-weight:700}
p{margin:0}
a{color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:100%}
.top{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.02em}
.top .spacer{flex:1}
.strip{flex-basis:100%;overflow-x:auto;min-width:0;margin-top:2px}
.strip table{width:auto;min-width:100%;font-size:11.5px;border-collapse:collapse}
.strip th,.strip td{padding:2px 7px;border-bottom:0;white-space:nowrap;line-height:1.3}
.strip th{font-size:10.5px;color:var(--muted);letter-spacing:.04em;padding-bottom:0}
.strip td{font-family:var(--font-num)}
.strip td.y{font-family:var(--font-ui);font-weight:700;color:var(--fg-2);text-align:left}
.strip td.tot{font-weight:700;border-left:1px solid var(--line)}
.strip td.manual{text-decoration:underline dotted var(--s-proj);text-underline-offset:3px}
.strip tr+tr td{border-top:1px solid var(--line)}
.chart .ovl{position:absolute;top:8px;left:64px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;backdrop-filter:blur(3px);z-index:2}
.chart .ovl .prow{display:grid;grid-template-columns:18px 86px 24px 24px;align-items:center;gap:4px}
.chart .ovl .prow b{font-family:var(--font-num);font-weight:600;text-align:right}
.chart .ovl .prow span{color:var(--muted);font-weight:700}
.chart .ovl button{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;height:22px;cursor:pointer;font-weight:700;color:var(--fg-2);padding:0;line-height:1}
.chart .ovl button:hover{background:var(--accent-soft);color:var(--accent)}
.chart .ovl .hint{font-size:10.5px;color:var(--muted);margin-top:2px}
.chart .h-move{cursor:move}.chart .h-amp{cursor:ns-resize}.chart .h-per{cursor:ew-resize}
.chart.dragging{user-select:none}
td input.manual{color:var(--s-proj);font-weight:600;text-decoration:underline dotted;text-underline-offset:3px}
td.manual{color:var(--s-proj);text-decoration:underline dotted;text-underline-offset:3px}
.ed{cursor:text;border-bottom:1px dashed transparent;border-radius:3px}
.ed:hover{border-bottom-color:var(--line-strong);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ed-input{font:inherit;font-family:var(--font-num);font-size:inherit;border:1px solid var(--accent);border-radius:4px;padding:1px 4px;background:var(--surface);color:var(--fg);text-align:right;min-width:0}
.kpi .value .ed-input{font-size:20px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2);background:var(--surface-2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok .dot{background:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

:root{--top-h:96px}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:14px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));align-self:start;height:calc(100vh - var(--top-h) - env(safe-area-inset-top,0px));overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg-2);text-decoration:none;font-weight:600;font-size:13.5px}
.nav a .k{width:22px;height:22px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-num);font-size:11px;color:var(--muted)}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.active{background:var(--accent-soft);color:var(--accent)}
.nav a.active .k{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.nav .group{margin:14px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.side .foot{margin:18px 10px 0;font-size:12px;color:var(--muted);line-height:1.45}

main{min-width:0;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--fg-2);max-width:72ch;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin-bottom:10px}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:-6px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi .value{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.kpi .value small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .delta{font-size:12.5px;margin-top:6px;color:var(--fg-2)}
.kpi .delta b{font-family:var(--font-num);font-weight:600}
.kpi .delta.up b{color:var(--accent)}
.kpi .delta.down b{color:var(--neg)}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:4px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .sep{width:1px;height:22px;background:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:600;font-size:13px}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;margin:0;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:16px}
.toggle .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--fg-2);font-weight:600}
.field .hint{font-size:11.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;background:var(--surface);min-width:0;width:100%}
.field input[type=number]{font-family:var(--font-num)}
.field textarea{font-family:var(--font-num);font-size:12px;line-height:1.4;min-height:120px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.stepper input{border:0 !important;border-radius:0 !important;text-align:center;flex:1}
.stepper button{border:0;background:var(--surface-2);width:30px;cursor:pointer;font-weight:700;color:var(--fg-2)}
.stepper button:hover{background:var(--accent-soft);color:var(--accent)}
.derived{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.derived div{font-size:12.5px;color:var(--fg-2)}
.derived b{display:block;font-family:var(--font-num);font-size:15px;color:var(--fg);font-weight:600}

.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line-strong)}
td.l,th.l{text-align:left}
td{font-family:var(--font-num)}
td.l{font-family:var(--font-ui);font-weight:600}
tr.total td{font-weight:600;border-top:2px solid var(--line-strong);background:var(--surface-2)}
tr:hover td{background:var(--surface-2)}
td.proj{color:var(--s-proj)}
td.sif{color:var(--s-hist);font-style:italic}
td.neg{color:var(--neg)}
td.posv{color:var(--pos)}
td input{width:96px;border:1px solid transparent;border-radius:6px;padding:3px 6px;background:transparent;text-align:right;font-family:var(--font-num)}
td input:hover{border-color:var(--line-strong)}
td input:focus{border-color:var(--accent);background:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
.legend i.sq{height:10px;width:10px;border-radius:2px}

.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;box-shadow:0 6px 20px -8px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;z-index:3;display:none;line-height:1.35}
.chart .tip b{font-weight:700}
.chart .tip .row{display:flex;gap:8px;justify-content:space-between;font-family:var(--font-num)}
.chart .tip .row i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.chart text{font-family:var(--font-num);font-size:11px;fill:var(--muted)}
.chart text.lbl{font-family:var(--font-ui);font-weight:600;fill:var(--fg-2)}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis)}
.note{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:var(--fg-2)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.note b{color:var(--fg)}
.note.warn b{color:inherit}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.pill.ibge{background:var(--accent-soft);color:var(--accent)}
.pill.sif{background:color-mix(in srgb,var(--s-hist) 18%,transparent);color:var(--s-hist)}
.pill.proj{background:color-mix(in srgb,var(--s-proj) 18%,transparent);color:var(--s-proj)}
.scen-list{display:flex;flex-direction:column;gap:8px}
.scen{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.scen .name{flex:1;font-weight:600}
.scen .meta{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:20;padding:16px}
.modal.open{display:grid}
.modal .box{background:var(--surface);border-radius:12px;padding:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.src-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.hide-mobile{display:initial}
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav .group,.side .foot{display:none}
  .hide-mobile{display:none}
  .kpi .value{font-size:24px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

    const chk = ols(xs,ys);
    reg = { a:P.regress.a, b:P.regress.b, n:chk?chk.n:0, r2:null, fixed:true, check:chk };
  }
  for (let i=0;i<N;i++) if (total[i]==null && sif[i]!=null){ total[i] = reg.a + reg.b*sif[i]; source[i]='sif'; }
  let lastKnown = -1; for (let i=0;i<N;i++) if (total[i]!=null) lastKnown=i;
  const fcStart = lastKnown+1;

  // média móvel 12m
  const mm12 = new Array(N).fill(null);
  for (let i=11;i<=lastKnown;i++){ let ok=true,s=0; for (let j=i-11;j<=i;j++){ if (total[j]==null){ok=false;break;} s+=total[j]; } if (ok) mm12[i]=s/12; }

  // ciclos
  const cyc = P.cycle; const starts = cyc.starts.map(s=>ymIdx(s)-start);
  const cycles = starts.map((s0,ci)=>{
    const s1 = ci<starts.length-1 ? starts[ci+1] : lastKnown;
    const vals=[]; for (let i=s0;i<=s1;i++) vals.push(mm12[i]);
    const v = vals.filter(x=>x!=null);
    return { label: cyc.labels[ci]||`Ciclo ${ci+1}`, start: idxYm(start+s0), end: idxYm(start+s1), n: v.length, values: vals,
             min: v.length?Math.min(...v):null, max: v.length?Math.max(...v):null, open: ci===starts.length-1 };
  });
  const c4 = starts[starts.length-1];
  const tOf = i => i - c4 + 1;
  const cosine = t => cyc.A + cyc.B*Math.cos(cyc.C*t + cyc.D);
  const base = new Array(N).fill(null); for (let i=fcStart;i<N;i++) base[i] = cosine(tOf(i));
  const splice = lastKnown>=0 && mm12[lastKnown]!=null ? { obs: mm12[lastKnown], fit: cosine(tOf(lastKnown)), t:tOf(lastKnown) } : null;

  // sazonalidade
  const C = D.cat; const catKey = P.saz.category;
  const catVal = i => catKey==='total' ? C.bois[i]+C.novilhos[i]+C.vacas[i]+C.novilhas[i]
    : catKey==='machos' ? C.bois[i]+C.novilhos[i] : catKey==='femeas' ? C.vacas[i]+C.novilhas[i] : C[catKey][i];
  const sharesFor = (y0,y1,key)=>{
    const t=new Array(12).fill(0); let g=0;
    C.months.forEach((m,i)=>{ const y=+m.slice(0,4); if (y>=y0&&y<=y1){ const v = key==='total'?C.bois[i]+C.novilhos[i]+C.vacas[i]+C.novilhas[i]: key==='machos'?C.bois[i]+C.novilhos[i]: key==='femeas'?C.vacas[i]+C.novilhas[i]: C[key][i]; t[+m.slice(5)-1]+=v; g+=v; } });
    return g>0 ? t.map(v=>v/g) : null;
  };
  const shares = sharesFor(P.saz.yearFrom, P.saz.yearTo, catKey);
  const sazCalc = shares ? shares.map(s=>s*12-1) : new Array(12).fill(0);
  const saz = P.saz.manual ? P.saz.manual.map((v,i)=> v==null? sazCalc[i] : v) : sazCalc;

  // clima (ENSO)
  const O = D.oni; const oniMap = new Map(O.months.map((m,i)=>[m,O.values[i]]));
  const lastOni = O.months.length? O.months[O.months.length-1] : null;
  const oniAt = ym => { if (oniMap.has(ym) && oniMap.get(ym)!=null) return oniMap.get(ym); if (P.clima.afterOni==='neutral' && lastOni && ymIdx(ym)>ymIdx(lastOni)) return 0; return null; };
  const climaAt = ym => {
    let e=0; for (let lag=0;lag<=30;lag++){ const v = oniAt(ymAdd(ym,-lag)); if (v==null) return null; e += D.betas.en[lag]*Math.max(0,v) + D.betas.ln[lag]*Math.min(0,v); }
    return e/100 * (P.clima.scale ?? 1);
  };
  const climaSeries = []; // para o gráfico
  if (O.months.length){ const o0 = ymIdx(O.months[0]); for (let i=o0+30;i<=horizon;i++){ const ym=idxYm(i); const e=climaAt(ym); if (e!=null) climaSeries.push({ym,e}); } }

  // cota China
  const Q = P.cota;
  const qf = -(Q.expPre/Q.prod)*(1-Q.redir);                 // queda fora de cota
  const qa = (Q.cota-Q.expPre)*(1-Q.redir)/Q.prod;           // queda anual
  const episodes = Q.episodes.map(ep=>({fim:parseDate(ep.fim), ini:parseDate(ep.ini), year:+ep.fim.slice(0,4)}));
  const fracMonth = (y,m)=>{ // fração do mês (y,m) fora de cota
    const d0 = Date.UTC(y,m-1,1), d1 = Date.UTC(y,m,1), nd = (d1-d0)/DAY; let f=0;
    for (const ep of episodes){ const lo=Math.max(ep.fim,d0), hi=Math.min(ep.ini,d1); f += Math.max(0,(hi-lo)/DAY)/nd; }
    return Math.min(1,f);
  };
  const profileFor = y => { const fr = Array.from({length:12},(_,k)=>fracMonth(y,k+1)); const fora=sum(fr), em=12-fora;
    const plus = em>0 ? (12*qa - fora*qf)/em : 0; return { fr, fora, em, plus, eff: fr.map(f=> plus + f*(qf-plus)) }; };
  const profiles = {}; const epYears = [...new Set(episodes.map(e=>e.year))];
  epYears.forEach(y=>profiles[y]=profileFor(y));
  const refProfile = profiles[epYears[0]] || profileFor(episodes.length?episodes[0].year:2026);
  const cotaAt = ym => {
    const y=+ym.slice(0,4), m=+ym.slice(5);
    const ov = Q.overrides && Q.overrides[ym];
    const prof = Q.repeat ? refProfile : (profiles[y] || null);
    if (ov==='zero') return 0;
    if (ov==='em_cota') return prof ? prof.plus : 0;
    if (typeof ov==='number') return ov;
    if (!prof){ // modo exato: ano sem episódio -> sem efeito, exceto se um episódio de outro ano invade este
      const fr = fracMonth(y,m); if (fr>0) return refProfile.plus + fr*(qf-refProfile.plus); return 0; }
    return prof.eff[m-1];
  };

  // projeção
  const E = P.effects;
  const fc = [];
  for (let i=fcStart;i<N;i++){
    const ym=months[i], m=+ym.slice(5);
    const s = saz[m-1], c = climaAt(ym) ?? 0, q = cotaAt(ym);
    const fs = E.saz?s:0, fcl = E.clima?c:0, fq = E.cota?q:0;
    const b = base[i]; const model = b*(1+fs)*(1+fcl)*(1+fq);
    const man = (P.manual && P.manual[ym]!=null) ? P.manual[ym] : null;
    fc.push({ ym, i, base:b, s, c, q, sOn:fs, cOn:fcl, qOn:fq, model, manual:man, final: man!=null? man : model,
      stepSaz: b*(1+fs), stepClima: b*(1+fs)*(1+fcl) });
  }
  const fcMap = new Map(fc.map(f=>[f.ym,f]));
  const series = months.map((ym,i)=> i<=lastKnown ? total[i] : fcMap.get(ym).final);

  // anuais
  const years = {}; months.forEach((ym,i)=>{ const y=+ym.slice(0,4); const v=series[i]; if (v==null) return;
    years[y] ??= { total:0, n:0, ibge:0, sif:0, proj:0, manual:0 }; years[y].total+=v; years[y].n++; years[y][source[i]||'proj']++; if (i>lastKnown && fcMap.get(ym).manual!=null) years[y].manual++; });
  const nManual = fc.filter(f=>f.manual!=null).length;

  return { months, N, start, total, sif, source, mm12, lastKnown, fcStart, reg, cycles, base, splice, cosine, tOf, c4, shares, saz, sazCalc, sharesFor,
           climaAt, climaSeries, oniAt, lastOni, qf, qa, profiles, refProfile, cotaAt, fc, fcMap, series, years, fracMonth, nManual };
}

// decomposição de efeitos para um conjunto de meses (PVM)
function decompose(M, ymList, order){
  const rows = ymList.map(ym=>M.fcMap.get(ym)).filter(Boolean);
  const base = sum(rows.map(r=>r.base)), model = sum(rows.map(r=>r.model)), final = sum(rows.map(r=>r.final));
  const manual = final - model;
  const iso = { saz: sum(rows.map(r=>r.base*r.sOn)), clima: sum(rows.map(r=>r.base*r.cOn)), cota: sum(rows.map(r=>r.base*r.qOn)) };
  const interaction = model - base - iso.saz - iso.clima - iso.cota;
  // sequencial na ordem dada
  const key = {saz:'sOn', clima:'cOn', cota:'qOn'};
  const seq = {}; let acc = rows.map(r=>r.base); let accSum = base;
  for (const k of order){ const next = acc.map((v,j)=>v*(1+rows[j][key[k]])); const ns = sum(next); seq[k] = ns-accSum; accSum=ns; acc=next; }
  return { n: rows.length, base, model, final, manual, iso, interaction, seq };
}

// ajuste automático do cosseno ao ciclo corrente (mínimos quadrados: A + α cos(Ct) + β sin(Ct), varredura em C)
function fitCosine(M){
  const vals = M.cycles[M.cycles.length-1].values; const pts=[]; vals.forEach((v,k)=>{ if (v!=null) pts.push([k+1,v]); });
  if (pts.length<12) return null;
  let best=null;
  for (let C=0.03; C<=0.16; C+=0.0005){
    // normal equations 3x3
    let S=[[0,0,0],[0,0,0],[0,0,0]], T=[0,0,0];
    for (const [t,y] of pts){ const x=[1,Math.cos(C*t),Math.sin(C*t)]; for(let i=0;i<3;i++){ T[i]+=x[i]*y; for(let j=0;j<3;j++) S[i][j]+=x[i]*x[j]; } }
    const sol = solve3(S,T); if (!sol) continue;
    let sse=0; for (const [t,y] of pts){ const yh = sol[0]+sol[1]*Math.cos(C*t)+sol[2]*Math.sin(C*t); sse+=(y-yh)**2; }
    if (!best || sse<best.sse){ const B=Math.hypot(sol[1],sol[2]); const Dp=Math.atan2(-sol[2],sol[1]); best={sse,C,A:sol[0],B,D:((Dp%(2*Math.PI))+2*Math.PI)%(2*Math.PI), n:pts.length}; }
  }
  if (best) best.rmse = Math.sqrt(best.sse/best.n);
  return best;
}
function solve3(A,b){ const m=A.map((r,i)=>[...r,b[i]]); for(let c=0;c<3;c++){ let p=c; for(let r=c+1;r<3;r++) if(Math.abs(m[r][c])>Math.abs(m[p][c])) p=r; if (Math.abs(m[p][c])<1e-12) return null; [m[c],m[p]]=[m[p],m[c]]; for(let r=0;r<3;r++){ if(r===c) continue; const f=m[r][c]/m[c][c]; for(let k=c;k<4;k++) m[r][k]-=f*m[c][k]; } } return m.map((r,i)=>r[3]/r[i]); }

/* ===================== gráficos SVG ===================== */
function svgEl(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function niceTicks(min,max,n=5){ if (!(max>min)) { max=min+1; } const span=max-min; const step0=span/n; const mag=10**Math.floor(Math.log10(step0)); const r=step0/mag; const step=(r<1.5?1:r<3?2:r<7?5:10)*mag; const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[]; for(let v=lo;v<=hi+step/2;v+=step) t.push(+v.toFixed(10)); return {ticks:t,lo,hi}; }

// Gráfico de linhas sobre eixo categórico comum (índices). series: [{name,color,values:[y|null], dash, width, area}]
function cw(el,fb){ const w=el.getBoundingClientRect().width; return w>40? Math.round(w) : (fb||900); }

  if (cfg.yMin!=null) ymin=Math.min(ymin,cfg.yMin); if (cfg.yMax!=null) ymax=Math.max(ymax,cfg.yMax);

  g+=`<g class="grid">`; ticks.forEach(t=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${ys(t)}" y2="${ys(t)}"/>`; g+=`<text x="${m.l-6}" y="${ys(t)+4}" text-anchor="end">${esc(cfg.yFmt?cfg.yFmt(t):t)}</text>`; }); g+=`</g>`;

  if (cfg.zeroLine && lo<0 && hi>0) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--axis)"/>`;
  cfg.series.forEach(s=>{
    let d='', area=''; let pen=false; let firstX=null,lastX=null;
    s.values.forEach((v,i)=>{ if(v==null){pen=false;return;} const x=xs(i),y=ys(v); d+= (pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; if(firstX==null)firstX=x; lastX=x; pen=true; });

    if(!rows){tip.style.display='none';return;}

  hit.addEventListener('pointermove',move); hit.addEventListener('pointerleave',()=>{tip.style.display='none';xh.style.display='none';});
  return { xs, ys, W, Hh, m, n, svg, lo, hi };
}

// Barras (positivas/negativas) sobre categorias
function barChart(el, cfg){
  const W=cw(el,cfg.width), Hh=cfg.height||240, m={t:14,r:12,b:30,l:52};

  g+=`</g><line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${ys(0)}" y2="${ys(0)}"/>`;
  cfg.values.forEach((v,i)=>{ const x=m.l+i*bw+bw*0.18, w=bw*0.64; const y0=ys(0), y1=ys(v??0); const top=Math.min(y0,y1), h=Math.max(1,Math.abs(y1-y0));

    if (n<=24) g+=`<text x="${x+w/2}" y="${Hh-m.b+16}" text-anchor="middle">${esc(cfg.labels[i])}</text>`; });
  g+=`<rect class="hit" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${Hh-m.t-m.b}" fill="transparent"/></svg>`;
  el.innerHTML=g+`<div class="tip"></div>`;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), hit=el.querySelector('.hit');
  hit.addEventListener('pointermove',ev=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W; let i=Math.floor((px-m.l)/bw); i=Math.max(0,Math.min(n-1,i));
    tip.innerHTML=`<b>${esc(cfg.tipTitle?cfg.tipTitle(i):cfg.labels[i])}</b><div class="row"><span>${esc(cfg.name||'')}</span><span>${esc(cfg.tipFmt?cfg.tipFmt(cfg.values[i],i):cfg.values[i])}</span></div>`; tip.style.display='block';
    tip.style.left=((m.l+i*bw+bw/2)/W*r.width)+'px'; tip.style.top=(ev.clientY-r.top)+'px'; });
  hit.addEventListener('pointerleave',()=>tip.style.display='none');

// Cascata (waterfall): steps [{label, value, kind:'total'|'delta'}]
function waterfall(el, cfg){
  const W=cw(el,cfg.width), Hh=cfg.height||300, m={t:18,r:12,b:44,l:56};
  const steps=cfg.steps; const n=steps.length; const bw=(W-m.l-m.r)/n;
  let run=0; const bars=steps.map(s=>{ if(s.kind==='total'){ run=s.value; return {lo:0,hi:s.value,v:s.value,kind:'total',label:s.label}; } const a=run, b=run+s.value; run=b; return {lo:Math.min(a,b),hi:Math.max(a,b),v:s.value,kind:'delta',label:s.label}; });
  const vmin=Math.min(...bars.map(b=>b.kind==='total'?b.v:b.lo)), vmax=Math.max(...bars.map(b=>b.hi)); const pad=(vmax-vmin)*0.12||1;
  const {ticks,lo,hi}=niceTicks(vmin-pad, vmax+pad*1.6,5);

/* ===================== edição por duplo clique ===================== */
function ed(text, kind, raw){ return `<span class="ed" data-ed="${kind}" data-raw="${raw!=null?raw:''}" title="Duplo clique para editar">${text}</span>`; }
document.addEventListener('dblclick', e=>{ const el=e.target.closest && e.target.closest('.ed'); if(!el || el.querySelector('input')) return; e.preventDefault(); startEdit(el); });
function startEdit(el){ const kind=el.dataset.ed; const inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal'; inp.value=el.dataset.raw; inp.className='ed-input'; inp.style.width=Math.max(64, el.offsetWidth+18)+'px'; inp.setAttribute('aria-label','editar valor'); el.textContent=''; el.appendChild(inp); inp.focus(); inp.select();
  let done=false; const commit=()=>{ if(done) return; done=true; applyEdit(kind, parseNum(inp.value), inp.value.trim()===''); };
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); commit(); } else if(ev.key==='Escape'){ done=true; render(); } });
  inp.addEventListener('blur',commit); }
function applyEdit(kind, v, empty){
  const [k,a,b]=kind.split(':'); const heads=x=> x<20000? x*1000 : x;
  if (k==='manual'){ state.params.manual ??= {}; if (empty||v==null) delete state.params.manual[a]; else state.params.manual[a]=Math.round(heads(v)); }
  else if (k==='hist'){ const H=state.data.hist; const i=H.months.indexOf(b); if(i<0){ render(); return; } H[a][i]= (empty||v==null)? null : Math.round(heads(v)); }
  else if (k==='year'){ if(v==null){ render(); return; } const y=+a; const target= v<1e6? v*1000 : v; const rows=M.fc.filter(f=>yearOf(f.ym)===y); if(!rows.length){ toast('Esse ano não tem meses projetados para ajustar.'); render(); return; } const cur=sum(rows.map(r=>r.final)); const fixed=M.years[y].total-cur; const factor=(target-fixed)/cur; if(!(factor>0)){ toast('Total inviável para os meses projetados.'); render(); return; } state.params.manual ??= {}; rows.forEach(r=>state.params.manual[r.ym]=Math.round(r.final*factor)); }
  else if (k==='param'){ if(v==null){ render(); return; } setPath(state.params, a, +(v*(parseFloat(b)||1)).toPrecision(12)); }
  else if (k==='saz'){ state.params.saz.manual ??= new Array(12).fill(null); state.params.saz.manual[+a]= (empty||v==null)? null : v/100; }
  else if (k==='cyc'){ if(v==null){ render(); return; } const c=state.params.cycle; if(a==='vale') c.B=Math.max(20000,Math.round(c.A-heads(v))); else if(a==='pico') c.B=Math.max(20000,Math.round(heads(v)-c.A)); else if(a==='per'){ if(v>3) c.C=+(2*Math.PI/v).toFixed(4); } else if(a==='dur'){ if(v>M.tOf(M.lastKnown)){ const g=cycleGeom(); const s=(v-g.tNow)/(g.tMin-g.tNow); const C=+(c.C/s).toFixed(4); c.D=+normAngle((c.C*g.tNow+c.D)-C*g.tNow).toFixed(3); c.C=C; } } }
  else if (k==='oni'){ const O=state.data.oni; const i=O.months.indexOf(a); if(i>=0) O.values[i]= (empty||v==null)? null : v; }
  markDirty(); render();
}

const LS_KEY='previsao-abate-v1';
let dbRef=null, dlCap=null, saveTimer=null;
function lsGet(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(LS_KEY, JSON.stringify(v)); }catch(e){} }
async function initCaps(){
  try{ if (window.claude?.use){ const db = await window.claude.use('db'); if (db){ dbRef = db.doc('model/state'); } dlCap = await window.claude.use('downloads'); } }catch(e){}
  let loaded=null, origin='default';
  if (dbRef){ try{ const snap = await dbRef.get(); if (snap.exists){ loaded = snap.data(); origin='nuvem'; } }catch(e){} }
  if (!loaded){ const l=lsGet(); if (l){ loaded=l; origin='navegador'; } }
  if (loaded && loaded.params && loaded.data){ state = migrate(loaded); state.meta.origin=origin; render(); }
  updateSaveChip();
}
function migrate(s){ const base = { data: clone(DEFAULT_DATA), params: clone(DEFAULT_PARAMS), scenarios:[], meta:{} }; const out = {...base, ...s}; out.params = deepMerge(clone(DEFAULT_PARAMS), s.params||{}); out.data = {...clone(DEFAULT_DATA), ...(s.data||{})}; out.meta = s.meta||{}; out.scenarios = s.scenarios||[]; out.vintages = s.vintages||[]; return out; }
function deepMerge(a,b){ for (const k in b){ if (b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object' && !Array.isArray(a[k])) deepMerge(a[k],b[k]); else a[k]=b[k]; } return a; }
async function saveState(){
  state.meta.savedAt = new Date().toISOString(); state.meta.origin = dbRef?'nuvem':'navegador';
  lsSet(state);
  if (dbRef){ try{ await dbRef.set(clone(state)); toast('Salvo na nuvem (compartilhado entre seus dispositivos).'); }catch(e){ toast('Salvo neste navegador. A nuvem recusou a gravação: '+(e.code||e.message||'')); state.meta.origin='navegador'; } }
  else toast('Salvo neste navegador.');

}

function updateSaveChip(){ const c=$('#saveChip'), t=$('#saveChipText'); c.classList.remove('ok','warn');

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800); }
async function download(filename, text, mime='text/csv'){
  if (dlCap){ try{ await dlCap.save({filename, data:text}); return; }catch(e){ if (e.code==='cancelled'||e.code==='declined') return; } }
  if (!window.claude){ try{ const blob=new Blob([text],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); return; }catch(e){} }
  if (typeof text!=='string'){ toast('O download de arquivos binários não está disponível nesta visualização.'); return; }
  openModal(`<h2>${esc(filename)}</h2><p class="sub">O download direto não está disponível nesta visualização. Copie o conteúdo abaixo.</p><textarea style="min-height:260px;font-family:var(--font-num);font-size:12px;width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px">${esc(text)}</textarea><div class="toolbar"><button class="btn primary" id="mCopy">Copiar</button><button class="btn" id="mClose">Fechar</button></div>`);

function monthlyTable(yrs, editable){

  const tot=yrs.map(y=>M.years[y]?.total);

function semesterTable(yrs){
  const semi=(y,h)=>{ let s=0,n=0; for(let m=h===1?1:7;m<=(h===1?6:12);m++){ const i=M.months.indexOf(`${y}-${String(m).padStart(2,'0')}`); if(i>=0&&M.series[i]!=null){s+=M.series[i];n++;} } return n===6?s:null; };
  let h=`<table><thead><tr><th class="l">Período</th>${yrs.map(y=>`<th>${y}</th>`).join('')}${yrs.slice(1).map(y=>`<th>${String(y).slice(2)}/${String(y-1).slice(2)}</th>`).join('')}</tr></thead><tbody>`;
  for (const s of [1,2]){ const v=yrs.map(y=>semi(y,s)); h+=`<tr><td class="l">${s}º semestre</td>${v.map(x=>`<td>${fmtMil(x,0)}</td>`).join('')}${yrs.slice(1).map((y,k)=>{ const r=v[k+1]&&v[k]?v[k+1]/v[k]-1:null; return `<td class="${r<0?'neg':''}">${fmtPct(r)}</td>`; }).join('')}</tr>`; }
  return h+'</tbody></table>';
}
function excelCheckTable(){
  const keys=Object.keys(EXCEL_REF); let maxd=0; const rows=keys.map(ym=>{ const i=M.months.indexOf(ym); const v=i>=0?M.series[i]:null; const d=v!=null?v-EXCEL_REF[ym]:null; if(d!=null) maxd=Math.max(maxd,Math.abs(d)); return {ym,v,ref:EXCEL_REF[ym],d}; });
  const show = rows.filter(r=>Math.abs(r.d||0)>50);
  let h=`<p class="sub" style="margin-top:0">Maior diferença absoluta: <b class="num">${fmtInt(maxd)}</b> cabeças em ${rows.length} meses.</p>`;
  if (!show.length) return h+`<p class="note">Todos os meses coincidem com a planilha (diferenças apenas de arredondamento).</p>`;
  h+=`<table><thead><tr><th class="l">Mês</th><th>App</th><th>Planilha</th><th>Dif.</th></tr></thead><tbody>${show.map(r=>`<tr><td class="l">${ymLabel(r.ym)}</td><td>${fmtInt(r.v)}</td><td>${fmtInt(r.ref)}</td><td class="${r.d<0?'neg':'posv'}">${fmtInt(r.d)}</td></tr>`).join('')}</tbody></table>`;
  return h;
}

function scenVintage(sc){ return state.vintages.find(v=>v.scenarioId===sc.id); }
function publishScenario(sc, on){
  const have=scenVintage(sc);
  if (on && !have){ const Ms=compute({...state, params:sc.params}); const values={}; Ms.fc.forEach(f=>values[f.ym]=Math.round(f.final)); state.vintages.push({id:'v'+Date.now(), name:sc.name, at:sc.at, lastKnown:Ms.months[Ms.lastKnown], values, author:sc.author, published:true, scenarioId:sc.id}); }
  if (!on && have){ state.vintages=state.vintages.filter(v=>v.id!==have.id); }
  sc.published=!!on;
}

function vintageStats(v){
  const rows=Object.keys(v.values).sort().map(ym=>{ const i=M.months.indexOf(ym); const real = (i>=0 && i<=M.lastKnown)? M.total[i] : null; const prev=v.values[ym];
    return { ym, prev, real, src: real!=null? M.source[i] : null, err: real!=null? real-prev : null, pct: real!=null? real/prev-1 : null }; });
  const cmp=rows.filter(r=>r.real!=null); const n=cmp.length;
  const mape = n? sum(cmp.map(r=>Math.abs(r.pct)))/n : null; const bias = n? sum(cmp.map(r=>r.pct))/n : null;
  const sp=sum(cmp.map(r=>r.prev)), sr=sum(cmp.map(r=>r.real));
  return { rows, cmp, n, mape, bias, cumErr: n? sr/sp-1 : null, sp, sr };
}

// geometria do ciclo corrente: vale (fim do ciclo) e pico seguintes ao último mês observado
function cycleGeom(){
  const c=state.params.cycle, per=2*Math.PI/c.C, tNow=M.tOf(M.lastKnown);
  let tMin=(Math.PI - c.D)/c.C; while (tMin<=tNow) tMin+=per; while (tMin-per>tNow) tMin-=per;
  let tMax=(2*Math.PI - c.D)/c.C; while (tMax<=tNow) tMax+=per; while (tMax-per>tNow) tMax-=per;
  const start=M.months[M.c4]; const tH=M.tOf(M.N-1);
  return { per, tNow, tMin, tMax, tTrough:Math.round(tMin), tPeak:Math.round(tMax), ymMin:ymAdd(start,Math.round(tMin)-1), ymMax:ymAdd(start,Math.round(tMax)-1), tH, start };
}

  if (geo.projIdx.length){ let d=''; geo.projIdx.forEach((k,j)=>{ d+=(j?'L':'M')+sc.xs(k).toFixed(1)+' '+sc.ys(geo.vals[k]).toFixed(1)+' '; }); add('path',{d,fill:'none',stroke:'transparent','stroke-width':'18',class:'h-move','data-h':'move'}); }

function bindCycleDrag(el){
  let drag=null;
  el.onpointerdown=e=>{ const h=e.target.dataset&&e.target.dataset.h; if(!h) return; e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('dragging');
    const {sc,geo}=el._geo; const r=el.querySelector('svg').getBoundingClientRect(); const g=cycleGeom(); const c=state.params.cycle;
    drag={h, sign:+(e.target.dataset.sign||1), x0:e.clientX, y0:e.clientY, p0:{...c}, pxPerT:(sc.xs(1)-sc.xs(0))*r.width/sc.W, pxPerV:(sc.ys(0)-sc.ys(1))*r.height/sc.Hh, t0:g.tNow, tTr0:g.tMin}; };
  el.onpointermove=e=>{ if(!drag) return; const c=state.params.cycle, p=drag.p0; const dT=(e.clientX-drag.x0)/drag.pxPerT, dV=-(e.clientY-drag.y0)/drag.pxPerV;
    if (drag.h==='move'){ c.A=Math.round(p.A+dV); c.D=+normAngle(p.D - p.C*dT).toFixed(3); }
    else if (drag.h==='amp'){ c.B=Math.max(20000, Math.round(p.B + drag.sign*dV)); }
    else if (drag.h==='per'){ const span0=drag.tTr0-drag.t0; const s=Math.min(4,Math.max(0.25,(span0+dT)/span0)); const C=+(p.C/s).toFixed(4); c.C=C; c.D=+normAngle((p.C*drag.t0+p.D) - C*drag.t0).toFixed(3); }
    M=compute(state); drawCycleChart(el, $('#cycleLegend')); const k=$('#cycleKpis'); if(k) k.innerHTML=viewCiclo.kpis(cycleGeom()); renderStrip(); };
  el.onpointerup=el.onpointercancel=e=>{ if(!drag) return; drag=null; el.classList.remove('dragging'); markDirty(); render(); };
}
function normAngle(a){ a=a%(2*Math.PI); if(a<0) a+=2*Math.PI; return a; }

  const O=D.oni; const oniStart=ymIdx(O.months[0]); const oniEnd=Math.max(ymIdx(O.months[O.months.length-1]), ymIdx(P.horizonEnd)); let lastOniRow=2;
  for (let i=oniStart;i<=oniEnd;i++){ const ym=idxYm(i); const r=3+(i-oniStart); lastOniRow=r; date(cl,'I'+r,ym); const v=M.oniAt(ym); if (v!=null) put(cl,'J'+r,v);
    put(cl,'K'+r,F(`IF(J${r}="","",MAX(0,J${r}))`)); put(cl,'L'+r,F(`IF(J${r}="","",MIN(0,J${r}))`)); if (r>=33) put(cl,'M'+r,F(`IF(COUNT(K${r-30}:K${r})<31,"",(SUMPRODUCT($F$3:$F$33,K${r-30}:K${r})+SUMPRODUCT($G$3:$G$33,L${r-30}:L${r}))*${P.clima.scale??1})`)); }
  put(cl,'O2', P.clima.afterOni==='neutral'? 'Após o último ONI informado, o app assume ONI = 0 (neutro); os zeros abaixo reproduzem isso.' : 'Após o último ONI informado o efeito é zerado (como na planilha original).');

  put(cc,'B19','Mês'); put(cc,'C19','Efeito China'); put(cc,'D19','% fora cota');
  for (let m=1;m<=12;m++){ const r=19+m; put(cc,'B'+r,m); put(cc,'C'+r,F(`$C$17+D${r}*($C$16-$C$17)`)); put(cc,'D'+r,F(`MAX(0, MIN($C$8, EOMONTH(DATE(YEAR($C$7),B${r},1),0)+1) - MAX($C$7, DATE(YEAR($C$7),B${r},1))) / (EOMONTH(DATE(YEAR($C$7),B${r},1),0)+1-DATE(YEAR($C$7),B${r},1))`)); }
  if (Q.episodes.length>1 || !Q.repeat) put(cc,'F19',`Atenção: o app usa ${Q.episodes.length} episódio(s) e ${Q.repeat?'repete o perfil todos os anos':'aplica datas por ano'}; a Série Temporal traz os efeitos mensais resultantes como valores.`);
  // ---------- Modelo ----------
  const md=sheet('Modelo'); const nc=M.cycles.length; const tNow=M.tOf(M.lastKnown); const tMax=Math.max(...M.cycles.map(c=>c.values.length), M.tOf(M.N-1)+24);
  M.cycles.forEach((cy,ci)=>{ put(md,COL(1+ci)+'1',cy.label); put(md,COL(1+ci)+'2',`${ymLabel(cy.start)}${cy.open?' ~':' - '+ymLabel(cy.end)}`); }); put(md,'A2','Meses');
  const curCol=COL(nc); // coluna do ciclo corrente
  for (let t=1;t<=tMax;t++){ const r=2+t; put(md,'A'+r,t);
    M.cycles.forEach((cy,ci)=>{ if (!cy.open){ if (cy.values[t-1]!=null) put(md,COL(1+ci)+r,cy.values[t-1]); } else { if (t<=tNow){ const ym=ymAdd(cy.start,t-1); if (H.months.includes(ym) && cy.values[t-1]!=null) put(md,curCol+r,F(`${PPN}!E${rowOf(ym)}`)); } else put(md,curCol+r,F(`$I$8+$I$11*COS($I$14*A${r}+$I$17)`)); } }); }
  put(md,'I5','PARÂMETROS'); put(md,'I7','A'); put(md,'I8',P.cycle.A); put(md,'I10','B'); put(md,'I11',P.cycle.B); put(md,'I13','C'); put(md,'I14',P.cycle.C); put(md,'I16','D'); put(md,'I17',P.cycle.D);
  ['A = DESLOCA VERTICAL','B = AMPLITUDE','C = VELOCIDADE/INCLINAÇÃO','D = DESLOCA HORIZONTAL'].forEach((x,k)=>put(md,'I'+(20+k),x));
  M.cycles.forEach((cy,ci)=>{ const c=COL(13+ci); const col=COL(1+ci); const last=2+ (cy.open? tNow : cy.values.length); put(md,c+'6',cy.label); put(md,c+'7',F(`COUNT(${col}3:${col}${last})`)); put(md,c+'8',F(`MIN(${col}3:${col}${last})`)); put(md,c+'9',F(`MAX(${col}3:${col}${last})`)); put(md,c+'10',F(`${c}9-${c}8`)); });
  ['Período','Min','Max','Amplitude'].forEach((x,k)=>put(md,'L'+(7+k),x));
  // ---------- Série Temporal ----------
  const st=sheet('Série Temporal'); ['Mês','Abate atual','Média Móvel Real','Abate projetado','Média Móvel Prevista','Ajuste Sazonal','Ajuste Climático','Ajuste Cota China','Ajuste manual'].forEach((h,k)=>put(st,COL(k)+'1',h));
  const climaRange=`Clima!$I$2:$M$${lastOniRow}`, climaKeys=`Clima!$I$2:$I$${lastOniRow}`;
  M.months.forEach((ym,i)=>{ const r=2+i; date(st,'A'+r,ym);
    if (i<=M.lastKnown){ if (H.months.includes(ym)) put(st,'B'+r,F(`${PPN}!B${rowOf(ym)}`)); if (i>=11) put(st,'C'+r,F(`AVERAGE(B${r-11}:B${r})`)); }
    if (i===M.lastKnown){ put(st,'D'+r,F(`B${r}`)); put(st,'E'+r,F(`C${r}`)); }
    if (i>=M.lastKnown){ const f=M.fcMap.get(ym);
      put(st,'F'+r, P.effects.saz? F(`VLOOKUP(MONTH(A${r}),Sazonalidade!$Y$129:$Z$140,2,FALSE)`) : 0);
      put(st,'G'+r, P.effects.clima? F(`IFERROR(INDEX(${climaRange},MATCH(A${r},${climaKeys},0),5)/100,0)`) : 0);
      const q = f? f.q : M.cotaAt(ym); const ov = Q.overrides && Q.overrides[ym]; const simpleCota = Q.repeat && Q.episodes.length===1 && !ov;
      put(st,'H'+r, !P.effects.cota? 0 : (simpleCota? F(`VLOOKUP(MONTH(A${r}),'Cota China'!$B$19:$C$31,2,FALSE)`) : q));
      if (i>M.lastKnown){ put(st,'E'+r,F(`Modelo!${curCol}${2+M.tOf(i)}`)); if (f.manual!=null){ put(st,'I'+r,f.manual); put(st,'D'+r,F(`I${r}`)); } else put(st,'D'+r,F(`E${r}*(1+F${r})*(1+G${r})*(1+H${r})`)); } } });
  const yrs=[...new Set(M.months.map(yearOf))].filter(y=>M.years[y]); let rr=M.N+6; put(st,'C'+(rr-1),'Ano'); put(st,'D'+(rr-1),'Milhões de cabeças'); put(st,'E'+(rr-1),'Mil cabeças');
  yrs.filter(y=>y>=2019).forEach(y=>{ const i1=M.months.indexOf(`${y}-01`), i2=M.months.indexOf(`${y}-12`); if(i1<0||i2<0) return; const parts=[]; const realEnd=Math.min(i2,M.lastKnown); if (realEnd>=i1) parts.push(`SUM(B${2+i1}:B${2+realEnd})`); const projStart=Math.max(i1,M.lastKnown+1); if (projStart<=i2) parts.push(`SUM(D${2+projStart}:D${2+i2})`); put(st,'C'+rr,y); put(st,'D'+rr,F(`(${parts.join('+')})/1000000`)); put(st,'E'+rr,F(`D${rr}*1000`)); rr++; });
  // ---------- Min Max ----------
  const mm=sheet('Min Max'); const tyrs=yrs.filter(y=>y>=2023); const [b0,b1]=ui.mmBand; const stRow=ym=>2+M.months.indexOf(ym);
  put(mm,'B3','Mês'); tyrs.forEach((y,k)=>put(mm,COL(2+k)+'3',String(y))); const cAvg=COL(2+tyrs.length), cMax=COL(3+tyrs.length), cMin=COL(4+tyrs.length); put(mm,cAvg+'3',`Avg ${String(b0).slice(2)}-${String(b1).slice(2)}`); put(mm,cMax+'3',`Max ${String(b0).slice(2)}-${String(b1).slice(2)}`); put(mm,cMin+'3','MIN');
  const cYoY0=6+tyrs.length; tyrs.slice(1).forEach((y,k)=>put(mm,COL(cYoY0+k)+'3',`${String(y).slice(2)}/${String(y-1).slice(2)}`));
  for (let m=1;m<=12;m++){ const r=3+m; put(mm,'B'+r,MESES[m-1]); const mm2=String(m).padStart(2,'0');
    tyrs.forEach((y,k)=>{ const i=M.months.indexOf(`${y}-${mm2}`); if (i<0||M.series[i]==null) return; put(mm,COL(2+k)+r,F(`'Série Temporal'!${i>M.lastKnown?'D':'B'}${2+i}/1000`)); });
    const bandRefs=[]; for(let y=b0;y<=b1;y++){ const i=M.months.indexOf(`${y}-${mm2}`); if(i>=0&&i<=M.lastKnown) bandRefs.push(`'Série Temporal'!B${2+i}/1000`); }
    if (bandRefs.length){ put(mm,cAvg+r,F(`AVERAGE(${bandRefs.join(',')})`)); put(mm,cMax+r,F(`MAX(${bandRefs.join(',')})`)); put(mm,cMin+r,F(`MIN(${bandRefs.join(',')})`)); }
    tyrs.slice(1).forEach((y,k)=>put(mm,COL(cYoY0+k)+r,F(`${COL(3+k)}${r}/${COL(2+k)}${r}-1`))); }
  tyrs.forEach((y,k)=>put(mm,COL(2+k)+'16',F(`SUM(${COL(2+k)}4:${COL(2+k)}15)`))); tyrs.slice(1).forEach((y,k)=>put(mm,COL(3+k)+'17',F(`${COL(3+k)}16/${COL(2+k)}16-1`)));
  // ---------- Tabela ----------
  const tb=sheet('Tabela'); put(tb,'B2','Previsão DATAGRO'); tyrs.forEach((y,k)=>put(tb,COL(2+k)+'4',y)); const vc0=3+tyrs.length; tyrs.slice(1).forEach((y,k)=>put(tb,COL(vc0+k)+'4',`Var (${String(y).slice(2)}/${String(y-1).slice(2)})`));
  for (let m=1;m<=12;m++){ const r=4+m; put(tb,'B'+r,MESES[m-1]); tyrs.forEach((y,k)=>put(tb,COL(2+k)+r,F(`'Min Max'!${COL(2+k)}${3+m}`))); tyrs.slice(1).forEach((y,k)=>put(tb,COL(vc0+k)+r,F(`${COL(3+k)}${r}/${COL(2+k)}${r}-1`))); }
  put(tb,'B17','Total Geral'); tyrs.forEach((y,k)=>put(tb,COL(2+k)+'17',F(`SUM(${COL(2+k)}5:${COL(2+k)}16)`))); put(tb,'B18','YoY'); tyrs.slice(1).forEach((y,k)=>put(tb,COL(3+k)+'18',F(`${COL(3+k)}17/${COL(2+k)}17-1`)));
  const iy=tyrs.indexOf(yearOf(M.months[M.fcStart])); if (iy>0){ const cP=COL(2+iy-1), cC=COL(2+iy); const yP=tyrs[iy-1], yC=tyrs[iy];
    put(tb,'E22',`H1/${yP}`); put(tb,'F22',`H1/${yC}`); put(tb,'G22','Var. YoY'); put(tb,'E23',F(`SUM(${cP}5:${cP}10)`)); put(tb,'F23',F(`SUM(${cC}5:${cC}10)`)); put(tb,'G23',F('F23/E23-1'));
    put(tb,'E25',`H2/${yP}`); put(tb,'F25',`H2/${yC}`); put(tb,'G25','Var. YoY'); put(tb,'E26',F(`SUM(${cP}11:${cP}16)`)); put(tb,'F26',F(`SUM(${cC}11:${cC}16)`)); put(tb,'G26',F('F26/E26-1')); }
  // ---------- Parâmetros (resumo) ----------
  const pr=sheet('Parâmetros do app'); put(pr,'A1','Bloco'); put(pr,'B1','Parâmetro'); put(pr,'C1','Valor'); let r=2; const add=(a,b,c)=>{ put(pr,'A'+r,a); put(pr,'B'+r,b); put(pr,'C'+r, typeof c==='object'? JSON.stringify(c) : c); r++; };
  add('Geral','Exportado em',new Date().toLocaleString('pt-BR')); add('Geral','Horizonte',P.horizonEnd); add('Geral','Último mês com dado',M.months[M.lastKnown]); add('Geral','Efeitos ativos',['saz','clima','cota'].filter(k=>P.effects[k]).join(', ')||'nenhum');
  add('Regressão','Modo',P.regress.mode); add('Regressão','a',M.reg.a); add('Regressão','b',M.reg.b); add('Ciclo','A',P.cycle.A); add('Ciclo','B',P.cycle.B); add('Ciclo','C',P.cycle.C); add('Ciclo','D',P.cycle.D); add('Ciclo','Inícios',P.cycle.starts.join(', '));
  add('Sazonalidade','Categoria',P.saz.category); add('Sazonalidade','Janela',`${P.saz.yearFrom}-${P.saz.yearTo}`); add('Clima','Após fim do ONI',P.clima.afterOni); add('Clima','Escala',P.clima.scale); add('Cota','Episódios',P.cota.episodes.map(e=>`${e.fim}→${e.ini}`).join('; ')); add('Cota','Repetir perfil',P.cota.repeat?'sim':'não'); add('Cota','Ajustes por mês',P.cota.overrides||{});

  const wb=XLSX.utils.book_new(); wb.Workbook={CalcPr:{fullCalcOnLoad:true}};
  for (const name in SH){ const ws={}; let maxR=0,maxC=0; for (const addr in SH[name].cells){ ws[addr]=SH[name].cells[addr]; const cc=XLSX.utils.decode_cell(addr); if(cc.r>maxR)maxR=cc.r; if(cc.c>maxC)maxC=cc.c; } ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}}); ws['!cols']=Array.from({length:maxC+1},()=>({wch:13})); XLSX.utils.book_append_sheet(wb, ws, name); }

}
let _xlsxLoading=null;
function loadXLSX(){ if (window.XLSX) return Promise.resolve(window.XLSX); if (_xlsxLoading) return _xlsxLoading; _xlsxLoading=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload=()=>res(window.XLSX); sc.onerror=()=>{ _xlsxLoading=null; rej(new Error('xlsx')); }; document.head.appendChild(sc); }); return _xlsxLoading; }
async function exportExcel(){ toast('Montando a planilha…'); try{ const XLSX=await loadXLSX(); const wb=xlBuild(XLSX); const out=XLSX.write(wb,{bookType:'xlsx',type:'array'}); await download(`Previsao_de_abate_${new Date().toISOString().slice(0,10)}.xlsx`, out, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }catch(e){ toast('Não foi possível gerar o Excel: '+(e.message||e)); } }

/* ===================== ações do topo ===================== */
$('#btnSave').onclick=()=>{ state.meta.dirty=false; saveState(); };
$('#btnReset').onclick=()=>{ openModal(`<h2>Restaurar padrão da planilha?</h2><p>Dados, parâmetros e ajustes voltam exatamente ao modelo Excel original. Os cenários salvos são mantidos.</p><div class="toolbar"><button class="btn primary" id="rsGo">Restaurar</button><button class="btn" id="mClose">Cancelar</button></div>`); $('#mClose').onclick=closeModal; $('#rsGo').onclick=()=>{ state.data=clone(DEFAULT_DATA); state.params=clone(DEFAULT_PARAMS); state.meta.dirty=true; closeModal(); render(); toast('Padrão restaurado. Clique em Salvar para gravar.'); }; };
$('#btnExport').onclick=()=>{ openModal(`<h2>Exportar</h2><div class="toolbar" style="flex-direction:column;align-items:stretch;gap:8px">
  <button class="btn primary" id="exXlsx">Planilha Excel com a estrutura do modelo original (.xlsx)</button>
  <button class="btn" id="exJson">Estado completo do modelo (JSON) — para backup ou para carregar em outro navegador</button>
  <button class="btn" id="exCsv">Série mensal com fatores (CSV)</button>
  <button class="btn" id="exTab">Tabela anual por mês (CSV)</button>
  <label class="btn" style="justify-content:center">Importar estado (JSON)… <input type="file" id="imJson" accept="application/json" hidden></label>
  <button class="btn ghost" id="mClose">Fechar</button></div>`); $('#mClose').onclick=closeModal;
  $('#exXlsx').onclick=exportExcel;

  $('#exCsv').onclick=()=>{ const lines=['mes;abate;origem;base_ciclo;saz;clima;cota']; M.months.forEach((ym,i)=>{ if(M.series[i]==null) return; const f=M.fcMap.get(ym); lines.push([ym,Math.round(M.series[i]),i>M.lastKnown?'projecao':M.source[i],(i>M.lastKnown?Math.round(M.base[i]):(M.mm12[i]!=null?Math.round(M.mm12[i]):'')),f?(f.sOn*100).toFixed(3):'',f?(f.cOn*100).toFixed(3):'',f?(f.qOn*100).toFixed(3):''].join(';')); }); download('previsao_abate.csv',lines.join('\n')); };
  $('#exTab').onclick=()=>{ const yrs=Object.keys(M.years).map(Number).filter(y=>y>=2019).sort(); const lines=['mes;'+yrs.join(';')]; for(let m=1;m<=12;m++) lines.push([MESES[m-1],...yrs.map(y=>{ const i=M.months.indexOf(`${y}-${String(m).padStart(2,'0')}`); return i>=0&&M.series[i]!=null?Math.round(M.series[i]):''; })].join(';')); lines.push(['total',...yrs.map(y=>Math.round(M.years[y].total))].join(';')); download('tabela_anual.csv',lines.join('\n')); };
